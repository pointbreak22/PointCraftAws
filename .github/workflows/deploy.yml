name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/pointcraftaws-api
  CLIENT_IMAGE: ghcr.io/${{ github.repository_owner }}/pointcraftaws-client

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # No manual token needed — GITHUB_TOKEN can push to this repo's own GHCR packages.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push api
        uses: docker/build-push-action@v6
        with:
          context: ./Api/PointCraftApi
          file: ./Api/PointCraftApi/WebAPI/Dockerfile
          push: true
          tags: ${{ env.API_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push client
        uses: docker/build-push-action@v6
        with:
          context: ./Client/point-craft-client
          push: true
          tags: ${{ env.CLIENT_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Pull new images and restart on the VM
        uses: appleboy/ssh-action@v1
        with:
          host: 13.60.83.42
          username: ubuntu
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ~/pointcraft
            git pull
            docker compose pull api client
            docker compose up -d
            docker builder prune -af
            docker image prune -af
