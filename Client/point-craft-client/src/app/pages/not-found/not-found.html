<app-site-header />

<main class="bg-background">
  <div class="mx-auto max-w-xl px-4 py-32 text-center sm:px-6">
    <p class="text-sm font-semibold text-accent-500">404</p>
    <h1 class="mt-2 text-2xl font-semibold text-foreground">{{ t().detail.notFoundTitle }}</h1>
    <p class="mt-3 text-muted-foreground">{{ t().detail.notFoundText }}</p>
    <a [routerLink]="home()" class="mt-6 inline-flex rounded-lg bg-accent-500 px-4 py-2 text-sm font-medium text-white hover:bg-accent-600">
      {{ t().detail.backHome }}
    </a>
  </div>
</main>

<app-site-footer />
