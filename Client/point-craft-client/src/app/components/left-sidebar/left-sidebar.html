<nav aria-label="Primary" class="hidden w-60 shrink-0 flex-col border-r border-border bg-surface p-3 md:flex">
  <p class="px-2 text-xs font-medium uppercase tracking-wide text-faint-foreground">Navigation</p>

  <ul class="mt-2 space-y-0.5">
    @for (link of links; track link.path) {
      <li>
        <a
          [routerLink]="link.path"
          routerLinkActive="bg-surface-hover text-foreground"
          class="block rounded-lg px-2 py-1.5 text-sm text-muted-foreground hover:bg-surface-hover hover:text-foreground"
        >
          {{ link.label }}
        </a>
      </li>
    }
  </ul>
</nav>
