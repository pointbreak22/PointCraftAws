<section id="stack" class="divider-glow bg-surface-alt px-4 py-16 sm:px-6 sm:py-24 lg:py-28">
  <div class="mx-auto max-w-6xl">
    <div appRevealOnScroll class="mx-auto max-w-2xl text-center">
      <p
        class="inline-flex items-center gap-2 rounded-full border border-accent-500/25 bg-accent-500/[0.07] px-3.5 py-1
               text-xs font-semibold text-accent-500"
      >
        <span aria-hidden="true" class="h-1.5 w-1.5 rounded-full bg-gradient-to-r from-accent-500 to-accent2-500"></span>
        {{ t().nav.stack }}
      </p>
      <h2 class="mt-4 text-[1.75rem] font-bold leading-tight text-foreground sm:text-4xl">{{ t().stack.heading }}</h2>
      <p class="mt-3 text-[15px] leading-relaxed text-muted-foreground sm:mt-4 sm:text-lg">{{ t().stack.subheading }}</p>
    </div>

    <div class="mt-10 sm:mt-14 grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3">
      @for (area of contentStore.techStack(); track area.id; let i = $index) {
        <div
          [appRevealOnScroll]="i * 80"
          appSpotlight
          class="surface-card relative rounded-2xl border border-border bg-surface p-5 transition duration-300 sm:p-6
                 card-glow motion-safe:hover:-translate-y-1 hover:border-transparent hover:shadow-2xl hover:shadow-accent-500/10"
        >
          <div class="flex items-center gap-3">
            <span class="flex h-10 w-10 items-center justify-center rounded-lg border border-accent-500/25 bg-accent-500/10">
              <svg [appIcon]="area.icon" class="h-5 w-5 text-accent-500"></svg>
            </span>
            <h3 class="text-lg font-bold text-foreground">{{ area.area }}</h3>
          </div>

          <div class="mt-4 flex flex-wrap gap-1.5">
            @for (tech of area.technologies; track tech) {
              <span class="rounded-full border border-border-strong bg-surface-alt px-2.5 py-1 text-xs font-medium text-foreground/85">
                {{ tech }}
              </span>
            }
          </div>

          <p class="mt-4 text-sm leading-relaxed text-muted-foreground">{{ area.benefit }}</p>
        </div>
      }
    </div>
  </div>
</section>
