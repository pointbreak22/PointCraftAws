<section id="stack" class="bg-surface-alt px-4 py-20 sm:px-6 sm:py-28">
  <div class="mx-auto max-w-6xl">
    <div appRevealOnScroll class="mx-auto max-w-2xl text-center">
      <p class="inline-flex items-center gap-2 text-xs font-semibold uppercase tracking-[0.2em] text-accent-500">
        <span aria-hidden="true" class="font-mono text-faint-foreground">03</span>
        <span aria-hidden="true" class="h-px w-6 bg-accent-500/50"></span>
        <span class="text-gradient-animated">{{ t().nav.stack }}</span>
      </p>
      <h2 class="mt-4 text-3xl font-bold text-foreground sm:text-4xl">{{ t().stack.heading }}</h2>
      <p class="mt-4 text-base leading-relaxed text-muted-foreground sm:text-lg">{{ t().stack.subheading }}</p>
    </div>

    <div class="mt-14 grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3">
      @for (area of contentStore.techStack(); track area.id; let i = $index) {
        <div
          [appRevealOnScroll]="i * 80"
          appSpotlight
          class="relative rounded-2xl border border-border bg-surface p-6 transition duration-300
                 card-glow motion-safe:hover:-translate-y-1 hover:border-transparent hover:shadow-2xl hover:shadow-accent-500/10"
        >
          <div class="flex items-center gap-3">
            <span class="flex h-10 w-10 items-center justify-center rounded-lg border border-accent-500/25 bg-accent-500/10">
              <svg [appIcon]="area.icon" class="h-5 w-5 text-accent-500"></svg>
            </span>
            <h3 class="text-lg font-bold text-foreground">{{ area.area }}</h3>
          </div>

          <div class="mt-4 flex flex-wrap gap-1.5">
            @for (tech of area.technologies; track tech) {
              <span class="rounded-full border border-border-strong bg-surface-alt px-2.5 py-1 text-xs font-medium text-foreground/85">
                {{ tech }}
              </span>
            }
          </div>

          <p class="mt-4 text-sm leading-relaxed text-muted-foreground">{{ area.benefit }}</p>
        </div>
      }
    </div>
  </div>
</section>
