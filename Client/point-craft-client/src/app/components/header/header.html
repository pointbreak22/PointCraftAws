<header class="flex h-14 shrink-0 items-center justify-between border-b border-border bg-surface px-4">
  <div class="flex items-center gap-2">
    <div class="h-7 w-7 rounded-lg bg-gradient-to-br from-accent-500 to-accent2-500"></div>
    <span class="text-sm font-semibold text-foreground">PointCraft</span>
  </div>

  <button
    type="button"
    class="flex h-8 w-8 items-center justify-center rounded-lg text-faint-foreground hover:bg-surface-hover hover:text-foreground"
    [attr.aria-label]="theme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
    (click)="toggleTheme()"
  >
    <svg [appIcon]="theme() === 'dark' ? 'sun' : 'moon'" class="h-4 w-4"></svg>
  </button>
</header>
