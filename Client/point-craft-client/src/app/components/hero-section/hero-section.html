<section class="relative overflow-hidden bg-background px-4 pb-20 pt-28 sm:px-6 sm:pt-36">
  <div
    aria-hidden="true"
    class="pointer-events-none absolute inset-0 -z-10 flex justify-center overflow-hidden"
  >
    <div
      class="mt-4 h-72 w-72 rounded-full bg-gradient-to-br from-accent-500/30 to-accent2-500/30
             blur-3xl motion-safe:animate-pulse"
    ></div>
  </div>

  <div appRevealOnScroll class="mx-auto max-w-3xl text-center">
    <span
      class="inline-flex items-center rounded-full border border-border bg-surface px-3 py-1 text-xs font-medium text-muted-foreground"
    >
      {{ t().hero.badge }}
    </span>

    <h1 class="mt-6 text-3xl font-semibold tracking-tight text-foreground sm:text-4xl lg:text-5xl">
      {{ t().hero.title }}
    </h1>

    <p class="mt-5 text-lg text-muted-foreground">
      {{ t().hero.subtitle }}
    </p>

    <div class="mt-8 flex flex-col items-center justify-center gap-3 sm:flex-row">
      <a
        href="#contact"
        class="rounded-lg bg-accent-500 px-5 py-2.5 text-sm font-medium text-white transition
               hover:bg-accent-600 hover:shadow-lg hover:shadow-accent-500/30
               motion-safe:hover:scale-[1.03] motion-safe:active:scale-[0.98]
               focus-visible:outline-none focus-visible:ring-2
               focus-visible:ring-accent-500 focus-visible:ring-offset-2 focus-visible:ring-offset-background"
      >
        {{ t().hero.ctaPrimary }}
      </a>
      <a
        href="#process"
        class="rounded-lg border border-border px-5 py-2.5 text-sm font-medium text-foreground transition
               hover:bg-surface-hover motion-safe:hover:scale-[1.03] motion-safe:active:scale-[0.98]
               focus-visible:outline-none focus-visible:ring-2
               focus-visible:ring-accent-500 focus-visible:ring-offset-2 focus-visible:ring-offset-background"
      >
        {{ t().hero.ctaSecondary }}
      </a>
    </div>
  </div>

  <ul class="mx-auto mt-14 grid max-w-4xl grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-4">
    @for (point of contentStore.trustPoints(); track point.label; let i = $index) {
      <li
        [appRevealOnScroll]="i * 80"
        class="flex items-center gap-3 rounded-xl border border-border bg-surface px-4 py-3
               transition hover:-translate-y-0.5 hover:border-accent-500/40"
      >
        <svg [appIcon]="point.icon" class="h-5 w-5 shrink-0 text-accent-500"></svg>
        <span class="text-sm text-foreground">{{ point.label }}</span>
      </li>
    }
  </ul>
</section>
