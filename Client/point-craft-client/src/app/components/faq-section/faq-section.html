<section id="faq" class="bg-surface-alt px-4 py-16 sm:px-6 sm:py-24 lg:py-28">
  <div class="mx-auto max-w-3xl">
    <div appRevealOnScroll class="mx-auto max-w-2xl text-center">
      <p
        class="inline-flex items-center gap-2 rounded-full border border-accent-500/25 bg-accent-500/[0.07] px-3.5 py-1
               text-xs font-semibold text-accent-500"
      >
        <span aria-hidden="true" class="h-1.5 w-1.5 rounded-full bg-gradient-to-r from-accent-500 to-accent2-500"></span>
        {{ t().nav.faq }}
      </p>
      <h2 class="mt-4 text-[1.75rem] font-bold leading-tight text-foreground sm:text-4xl">{{ t().faq.heading }}</h2>
      <p class="mt-3 text-[15px] leading-relaxed text-muted-foreground sm:mt-4 sm:text-lg">{{ t().faq.subheading }}</p>
    </div>

    <div class="mt-10 sm:mt-14 space-y-3">
      @for (item of t().faq.items; track item.question) {
        <details class="group rounded-2xl border border-border bg-surface transition hover:border-border-strong open:border-accent-500/40 open:shadow-lg open:shadow-accent-500/5">
          <summary
            class="flex cursor-pointer list-none items-center justify-between gap-4 rounded-2xl px-5 py-4 sm:px-6 sm:py-5
                   text-left text-base font-semibold text-foreground focus-visible:outline-none
                   focus-visible:ring-2 focus-visible:ring-accent-500 [&::-webkit-details-marker]:hidden"
          >
            <h3>{{ item.question }}</h3>
            <span class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full border border-border transition group-open:border-accent-500/40 group-open:bg-accent-500/10">
              <svg appIcon="chevron-down" class="h-4 w-4 text-muted-foreground transition-transform duration-300 group-open:rotate-180 group-open:text-accent-500"></svg>
            </span>
          </summary>
          <p class="px-5 pb-5 text-sm sm:px-6 sm:pb-6 leading-relaxed text-muted-foreground sm:text-base">{{ item.answer }}</p>
        </details>
      }
    </div>
  </div>
</section>
