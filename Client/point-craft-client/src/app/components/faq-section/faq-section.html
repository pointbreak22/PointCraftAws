<section id="faq" class="bg-surface-alt px-4 py-20 sm:px-6">
  <div class="mx-auto max-w-3xl">
    <div appRevealOnScroll class="mx-auto max-w-2xl text-center">
      <h2 class="text-3xl font-semibold text-foreground">{{ t().faq.heading }}</h2>
      <p class="mt-3 text-muted-foreground">{{ t().faq.subheading }}</p>
    </div>

    <div class="mt-12 space-y-3">
      @for (item of t().faq.items; track item.question) {
        <details class="group rounded-2xl border border-border bg-surface transition open:border-accent-500/40">
          <summary
            class="flex cursor-pointer list-none items-center justify-between gap-4 rounded-2xl px-5 py-4
                   text-left text-base font-medium text-foreground focus-visible:outline-none
                   focus-visible:ring-2 focus-visible:ring-accent-500 [&::-webkit-details-marker]:hidden"
          >
            <h3>{{ item.question }}</h3>
            <svg appIcon="chevron-down" class="h-5 w-5 shrink-0 text-faint-foreground transition-transform group-open:rotate-180"></svg>
          </summary>
          <p class="px-5 pb-5 text-sm leading-relaxed text-muted-foreground">{{ item.answer }}</p>
        </details>
      }
    </div>
  </div>
</section>
