<section id="faq" class="bg-surface-alt px-4 py-20 sm:px-6 sm:py-28">
  <div class="mx-auto max-w-3xl">
    <div appRevealOnScroll class="mx-auto max-w-2xl text-center">
      <p class="inline-flex items-center gap-2 text-xs font-semibold uppercase tracking-[0.2em] text-accent-500">
        <span aria-hidden="true" class="font-mono text-faint-foreground">05</span>
        <span aria-hidden="true" class="h-px w-6 bg-accent-500/50"></span>
        <span class="text-gradient-animated">{{ t().nav.faq }}</span>
      </p>
      <h2 class="mt-4 text-3xl font-bold text-foreground sm:text-4xl">{{ t().faq.heading }}</h2>
      <p class="mt-4 text-base leading-relaxed text-muted-foreground sm:text-lg">{{ t().faq.subheading }}</p>
    </div>

    <div class="mt-14 space-y-3">
      @for (item of t().faq.items; track item.question) {
        <details class="group rounded-2xl border border-border bg-surface transition hover:border-border-strong open:border-accent-500/40 open:shadow-lg open:shadow-accent-500/5">
          <summary
            class="flex cursor-pointer list-none items-center justify-between gap-4 rounded-2xl px-6 py-5
                   text-left text-base font-semibold text-foreground focus-visible:outline-none
                   focus-visible:ring-2 focus-visible:ring-accent-500 [&::-webkit-details-marker]:hidden"
          >
            <h3>{{ item.question }}</h3>
            <span class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full border border-border transition group-open:border-accent-500/40 group-open:bg-accent-500/10">
              <svg appIcon="chevron-down" class="h-4 w-4 text-muted-foreground transition-transform duration-300 group-open:rotate-180 group-open:text-accent-500"></svg>
            </span>
          </summary>
          <p class="px-6 pb-6 text-sm leading-relaxed text-muted-foreground sm:text-base">{{ item.answer }}</p>
        </details>
      }
    </div>
  </div>
</section>
