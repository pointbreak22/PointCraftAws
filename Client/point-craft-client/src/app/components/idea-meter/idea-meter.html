<span class="w-[6.5rem] shrink-0 sm:w-[7.5rem] text-[11px] font-semibold uppercase tracking-wide text-faint-foreground">{{ label() }}</span>
<span aria-hidden="true" class="flex flex-1 gap-1">
  @for (filled of segments(); track $index) {
    <span
      class="h-1.5 flex-1 rounded-full"
      [class]="filled ? 'bg-gradient-to-r from-accent-500 to-accent2-500 shadow-[0_0_8px] shadow-accent-500/40' : 'bg-border-strong'"
    ></span>
  }
</span>
<span class="sr-only">{{ label() }}: {{ value() }} {{ outOf() }} {{ max() }}</span>
