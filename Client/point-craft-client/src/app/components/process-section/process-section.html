<section id="process" class="bg-surface-alt px-4 py-20 sm:px-6">
  <div class="mx-auto max-w-4xl">
    <div appRevealOnScroll class="mx-auto max-w-2xl text-center">
      <h2 class="text-3xl font-semibold text-foreground">{{ t().process.heading }}</h2>
      <p class="mt-3 text-muted-foreground">{{ t().process.subheading }}</p>
    </div>

    <ol class="mt-12 space-y-6">
      @for (step of contentStore.processSteps(); track step.step; let i = $index) {
        <li
          [appRevealOnScroll]="i * 100"
          class="flex gap-4 rounded-2xl border border-border bg-surface p-5 transition
                 hover:-translate-y-1 hover:border-accent-500/40"
        >
          <span
            class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-gradient-to-br
                   from-accent-500 to-accent2-500 text-sm font-semibold text-white"
          >
            {{ step.step }}
          </span>
          <div>
            <h3 class="text-base font-semibold text-foreground">{{ step.title }}</h3>
            <p class="mt-1 text-sm text-muted-foreground">{{ step.description }}</p>
          </div>
        </li>
      }
    </ol>
  </div>
</section>
