<section id="process" class="bg-background px-4 py-16 sm:px-6 sm:py-24 lg:py-28">
  <div class="mx-auto max-w-6xl">
    <div appRevealOnScroll class="mx-auto max-w-2xl text-center">
      <p
        class="inline-flex items-center gap-2 rounded-full border border-accent-500/25 bg-accent-500/[0.07] px-3.5 py-1
               text-xs font-semibold text-accent-500"
      >
        <span aria-hidden="true" class="h-1.5 w-1.5 rounded-full bg-gradient-to-r from-accent-500 to-accent2-500"></span>
        {{ t().nav.process }}
      </p>
      <h2 class="mt-4 text-[1.75rem] font-bold leading-tight text-foreground sm:text-4xl">{{ t().process.heading }}</h2>
      <p class="mt-3 text-[15px] leading-relaxed text-muted-foreground sm:mt-4 sm:text-lg">{{ t().process.subheading }}</p>
    </div>

    <ol class="relative mt-10 sm:mt-14 grid gap-4 lg:auto-cols-fr lg:grid-flow-col lg:gap-5">
      <!-- Connecting line: vertical on mobile, horizontal through the step badges on desktop. -->
      <span
        aria-hidden="true"
        class="absolute bottom-6 left-[1.6rem] top-6 w-px bg-gradient-to-b from-accent-500/60 via-border-strong to-accent2-500/60
               lg:inset-x-10 lg:bottom-auto lg:top-[2.1rem] lg:h-px lg:w-auto lg:bg-gradient-to-r"
      ></span>
      @for (step of contentStore.processSteps(); track step.step; let i = $index) {
        <li
          [appRevealOnScroll]="i * 100"
          appSpotlight
          class="group relative flex gap-4 rounded-2xl border border-border bg-surface p-5 transition duration-300
                 hover:border-accent-500/40 lg:flex-col lg:gap-5 lg:p-6 motion-safe:hover:-translate-y-1"
        >
          <span
            class="relative flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-gradient-to-br
                   from-accent-500 to-accent2-500 font-display text-sm font-bold text-white
                   shadow-lg shadow-accent-500/30 ring-4 ring-surface"
          >
            {{ step.step }}
          </span>
          <div>
            <h3 class="text-base font-bold text-foreground">{{ step.title }}</h3>
            <p class="mt-1.5 text-sm leading-relaxed text-muted-foreground">{{ step.description }}</p>
          </div>
        </li>
      }
    </ol>
  </div>
</section>
