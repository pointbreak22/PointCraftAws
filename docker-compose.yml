services:
  api:
    # image: what `docker compose pull` fetches on the VM (built + pushed by
    # .github/workflows/deploy.yml). build: still here so local `docker compose build`
    # keeps working exactly as before, tagging the result with the same name.
    image: ghcr.io/pointbreak22/pointcraftaws-api:latest
    build:
      context: ./Api/PointCraftApi
      dockerfile: WebAPI/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Data Source=/data/pointcraft.db"
      AllowedOrigins__0: ${ALLOWED_ORIGIN:-http://localhost}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY must be set in .env}
      Jwt__Issuer: pointcraft-api
      Admin__Username: ${ADMIN_USERNAME:?ADMIN_USERNAME must be set in .env}
      Admin__PasswordHash: ${ADMIN_PASSWORD_HASH:?ADMIN_PASSWORD_HASH must be set in .env}
      TelegramBot__Enabled: ${TELEGRAM_BOT_ENABLED:-false}
      TelegramBot__BotToken: ${TELEGRAM_BOT_TOKEN:-}
    volumes:
      - api_data:/data
    expose:
      - "8080"

  client:
    image: ghcr.io/pointbreak22/pointcraftaws-client:latest
    build:
      context: ./Client/point-craft-client
    restart: unless-stopped
    environment:
      PORT: 4000
      # Lets server-side rendering ('/') reach the API over the Docker network — see
      # core/http/api-url.interceptor.ts. Browser requests never use this; they stay relative,
      # proxied by Caddy.
      INTERNAL_API_URL: http://api:8080
    expose:
      - "4000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - client

volumes:
  api_data:
  caddy_data:
  caddy_config:
