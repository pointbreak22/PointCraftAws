services:
  api:
    build:
      context: ./Api/PointCraftApi
      dockerfile: WebAPI/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Data Source=/data/pointcraft.db"
      AllowedOrigins__0: ${ALLOWED_ORIGIN:-http://localhost}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY must be set in .env}
      Jwt__Issuer: pointcraft-api
      Admin__Username: ${ADMIN_USERNAME:?ADMIN_USERNAME must be set in .env}
      Admin__PasswordHash: ${ADMIN_PASSWORD_HASH:?ADMIN_PASSWORD_HASH must be set in .env}
      TelegramBot__Enabled: ${TELEGRAM_BOT_ENABLED:-false}
      TelegramBot__BotToken: ${TELEGRAM_BOT_TOKEN:-}
    volumes:
      - api_data:/data
    expose:
      - "8080"

  client:
    build:
      context: ./Client/point-craft-client
    restart: unless-stopped
    environment:
      PORT: 4000
    expose:
      - "4000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - client

volumes:
  api_data:
  caddy_data:
  caddy_config:
